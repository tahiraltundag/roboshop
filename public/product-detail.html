<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ürün detayları - RoboShop">
  <title>Ürün Detay | RoboShop</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
  <link rel="stylesheet" href="/css/index.css">
  <link rel="stylesheet" href="/css/components.css">
  <style>
    .product-detail { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2xl); padding: var(--space-2xl) 0; }
    .product-image-box { background: var(--gradient-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; min-height: 400px; overflow: hidden; position: sticky; top: calc(var(--nav-height) + 1rem); }
    .product-image-box img { width: 100%; height: 100%; object-fit: cover; }
    .product-image-box .placeholder { font-size: 8rem; opacity: 0.4; }
    .product-info h1 { font-family: var(--font-display); font-size: 1.8rem; margin-bottom: var(--space-md); }
    .product-meta { display: flex; align-items: center; gap: var(--space-lg); margin-bottom: var(--space-lg); flex-wrap: wrap; }
    .product-price-box { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: var(--space-lg); margin-bottom: var(--space-lg); }
    .product-price-box .big-price { font-family: var(--font-display); font-size: 2.2rem; font-weight: 800; color: var(--accent-blue); }
    .product-price-box .old-price { font-size: 1.1rem; color: var(--text-muted); text-decoration: line-through; margin-left: var(--space-md); }
    .product-price-box .discount-badge { margin-left: var(--space-md); }
    .qty-selector { display: flex; align-items: center; gap: var(--space-sm); margin: var(--space-lg) 0; }
    .qty-btn { width: 36px; height: 36px; background: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: var(--text-primary); font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .qty-value { width: 50px; text-align: center; font-size: 1.1rem; font-weight: 600; }
    .add-to-cart-btn { width: 100%; padding: 1rem; font-size: 1.05rem; }
    .specs-table { width: 100%; }
    .specs-table tr td { padding: 0.7rem 1rem; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; }
    .specs-table tr td:first-child { color: var(--text-muted); font-weight: 500; width: 40%; }
    .review-item { padding: var(--space-lg); border-bottom: 1px solid var(--border-color); }
    .review-header { display: flex; justify-content: space-between; margin-bottom: var(--space-sm); }
    .review-author { font-weight: 600; }
    .review-date { color: var(--text-muted); font-size: 0.8rem; }
    .review-text { color: var(--text-secondary); font-size: 0.9rem; line-height: 1.6; }
    @media (max-width: 768px) { .product-detail { grid-template-columns: 1fr; } .product-image-box { position: static; min-height: 280px; } }
  </style>
</head>
<body>
  <header class="navbar" id="navbar"></header>

  <div class="page-header">
    <div class="container">
      <div class="breadcrumb"><a href="/">Ana Sayfa</a> <span>/</span> <a href="/products.html">Ürünler</a> <span>/</span> <span id="breadcrumbName">...</span></div>
    </div>
  </div>

  <main class="container">
    <div class="product-detail" id="productDetail">
      <div class="spinner" style="grid-column:1/-1"></div>
    </div>

    <!-- Tabs -->
    <div id="productTabs" style="display:none;padding-bottom:var(--space-2xl)">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('specs', this)">📋 Teknik Özellikler</button>
        <button class="tab-btn" onclick="switchTab('desc', this)">📝 Açıklama</button>
        <button class="tab-btn" onclick="switchTab('reviews', this)">⭐ Yorumlar (<span id="reviewCountTab">0</span>)</button>
      </div>
      <div class="tab-content active" id="tab-specs"></div>
      <div class="tab-content" id="tab-desc"></div>
      <div class="tab-content" id="tab-reviews"></div>
    </div>

    <!-- Related Products -->
    <section style="padding-bottom:var(--space-2xl)" id="relatedSection" style="display:none">
      <h2 class="section-title">Benzer <span class="text-gradient">Ürünler</span></h2>
      <div class="grid grid-4" id="relatedGrid"></div>
    </section>
  </main>

  <footer class="footer" id="footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script>
    let productData = null;
    let quantity = 1;

    function switchTab(tab, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(`tab-${tab}`).classList.add('active');
    }

    function changeQty(delta) {
      if (!productData) return;
      quantity = Math.max(1, Math.min(quantity + delta, productData.stock));
      document.getElementById('qtyValue').textContent = quantity;
    }

    async function loadProduct() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (!id) { window.location.href = '/products.html'; return; }

      try {
        const data = await api.getProduct(id);
        productData = data.product;
        const p = data.product;
        document.title = `${p.name} | RoboShop`;
        document.getElementById('breadcrumbName').textContent = p.name;

        const hasDiscount = p.discount_price && p.discount_price < p.price;
        const price = p.discount_price || p.price;
        const discount = hasDiscount ? Math.round((1 - p.discount_price / p.price) * 100) : 0;

        document.getElementById('productDetail').innerHTML = `
          <div class="product-image-box">
            ${p.image_url ? `<img src="${p.image_url}" alt="${p.name}" onerror="this.style.display='none';this.parentElement.innerHTML='<span class=placeholder>🤖</span>'">` : '<span class="placeholder">🤖</span>'}
          </div>
          <div class="product-info">
            <span class="badge badge-blue">${p.category_name}</span>
            <h1>${p.name}</h1>
            <div class="product-meta">
              <span>${starsHTML(p.rating, p.review_count)}</span>
              <span class="badge ${p.stock > 0 ? 'badge-green' : 'badge-red'}">${p.stock > 0 ? `${p.stock} adet stokta` : 'Tükendi'}</span>
            </div>
            <div class="product-price-box">
              <span class="big-price">${formatPrice(price)}</span>
              ${hasDiscount ? `<span class="old-price">${formatPrice(p.price)}</span><span class="badge badge-red discount-badge">%${discount} İndirim</span>` : ''}
            </div>
            <p style="color:var(--text-secondary);line-height:1.7;margin-bottom:var(--space-lg)">${p.description ? p.description.substring(0, 200) + '...' : ''}</p>
            ${p.stock > 0 ? `
              <div class="qty-selector">
                <span style="color:var(--text-muted);font-size:0.9rem">Miktar:</span>
                <button class="qty-btn" onclick="changeQty(-1)">−</button>
                <span class="qty-value" id="qtyValue">1</span>
                <button class="qty-btn" onclick="changeQty(1)">+</button>
              </div>
              <button class="btn btn-primary add-to-cart-btn" onclick="addToCartDetail()">🛒 Sepete Ekle</button>
            ` : '<button class="btn btn-primary add-to-cart-btn" disabled>Stokta Yok</button>'}
          </div>
        `;

        // Tabs
        document.getElementById('productTabs').style.display = 'block';

        // Specs tab
        let specs = {};
        try { specs = JSON.parse(p.specs); } catch {}
        const specsHtml = Object.keys(specs).length > 0
          ? `<table class="specs-table">${Object.entries(specs).map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('')}</table>`
          : '<p style="color:var(--text-muted)">Teknik özellikler belirtilmemiş.</p>';
        document.getElementById('tab-specs').innerHTML = specsHtml;

        // Desc tab
        document.getElementById('tab-desc').innerHTML = `<p style="color:var(--text-secondary);line-height:1.8">${p.description || 'Açıklama mevcut değil.'}</p>`;

        // Reviews tab
        document.getElementById('reviewCountTab').textContent = data.reviews.length;
        let reviewsHtml = '';
        if (data.reviews.length > 0) {
          reviewsHtml = data.reviews.map(r => `
            <div class="review-item">
              <div class="review-header">
                <span><span class="review-author">${r.user_name}</span> ${starsHTML(r.rating)}</span>
                <span class="review-date">${new Date(r.created_at).toLocaleDateString('tr-TR')}</span>
              </div>
              <p class="review-text">${r.comment}</p>
            </div>
          `).join('');
        } else {
          reviewsHtml = '<p style="color:var(--text-muted);padding:var(--space-lg)">Henüz yorum yapılmamış.</p>';
        }
        // Add review form
        const user = getUser();
        if (user) {
          reviewsHtml += `
            <div style="padding:var(--space-lg)">
              <h4 style="margin-bottom:var(--space-md)">Yorum Yap</h4>
              <div class="form-group">
                <label class="form-label">Puanınız</label>
                <select id="reviewRating" class="form-select" style="width:auto"><option value="5">⭐⭐⭐⭐⭐ (5)</option><option value="4">⭐⭐⭐⭐ (4)</option><option value="3">⭐⭐⭐ (3)</option><option value="2">⭐⭐ (2)</option><option value="1">⭐ (1)</option></select>
              </div>
              <div class="form-group"><textarea id="reviewComment" class="form-textarea" placeholder="Yorumunuzu yazın..."></textarea></div>
              <button class="btn btn-primary" onclick="submitReview()">Gönder</button>
            </div>`;
        }
        document.getElementById('tab-reviews').innerHTML = reviewsHtml;

        // Related
        if (data.related && data.related.length > 0) {
          document.getElementById('relatedGrid').innerHTML = data.related.map(p => productCardHTML(p)).join('');
        }

      } catch (err) {
        document.getElementById('productDetail').innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-state-icon">😕</div><h3>Ürün bulunamadı</h3><a href="/products.html" class="btn btn-primary" style="margin-top:1rem">Ürünlere Dön</a></div>`;
      }
    }

    async function addToCartDetail() {
      if (!productData) return;
      const user = getUser();
      if (!user) { showToast('Giriş yapmalısınız.', 'error'); setTimeout(() => window.location.href = '/auth.html', 1500); return; }
      try {
        await api.addToCart(productData.id, quantity);
        showToast(`${quantity} adet ürün sepete eklendi!`, 'success');
        updateCartBadge();
      } catch (err) { showToast(err.message, 'error'); }
    }

    async function submitReview() {
      if (!productData) return;
      const rating = parseInt(document.getElementById('reviewRating').value);
      const comment = document.getElementById('reviewComment').value.trim();
      if (!comment) { showToast('Lütfen bir yorum yazın.', 'error'); return; }
      try {
        await api.addReview({ product_id: productData.id, rating, comment });
        showToast('Yorumunuz eklendi!', 'success');
        loadProduct();
      } catch (err) { showToast(err.message, 'error'); }
    }

    document.addEventListener('DOMContentLoaded', loadProduct);
  </script>
</body>
</html>
