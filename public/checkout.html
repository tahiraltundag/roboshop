<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ödeme | RoboShop</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
  <link rel="stylesheet" href="/css/index.css">
  <link rel="stylesheet" href="/css/components.css">
  <style>
    .checkout-layout { display: grid; grid-template-columns: 1fr 400px; gap: var(--space-xl); padding: var(--space-2xl) 0; }
    .checkout-section { margin-bottom: var(--space-xl); }
    .checkout-section h3 { font-family: var(--font-display); font-size: 1.1rem; margin-bottom: var(--space-lg); padding-bottom: var(--space-sm); border-bottom: 1px solid var(--border-color); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-md); }
    .order-item { display: flex; gap: var(--space-md); padding: 0.6rem 0; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; }
    .order-item-qty { color: var(--text-muted); white-space: nowrap; }
    .success-overlay { position: fixed; inset: 0; background: rgba(10,10,15,0.95); display: flex; align-items: center; justify-content: center; z-index: 5000; }
    .success-card { text-align: center; max-width: 450px; padding: var(--space-3xl); }
    .success-icon { font-size: 5rem; margin-bottom: var(--space-lg); animation: float 2s ease infinite; }
    .payment-methods { display: flex; gap: var(--space-md); margin-bottom: var(--space-lg); }
    .payment-method { flex: 1; padding: var(--space-md); border: 1.5px solid var(--border-color); border-radius: var(--radius-md); text-align: center; cursor: pointer; transition: all var(--transition-fast); font-size: 0.85rem; }
    .payment-method:hover, .payment-method.active { border-color: var(--accent-blue); background: rgba(0,212,255,0.05); }
    .payment-method .pm-icon { font-size: 1.5rem; display: block; margin-bottom: var(--space-xs); }
    @media (max-width: 768px) { .checkout-layout { grid-template-columns: 1fr; } .form-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="navbar" id="navbar"></header>

  <div class="page-header">
    <div class="container">
      <div class="breadcrumb"><a href="/">Ana Sayfa</a> <span>/</span> <a href="/cart.html">Sepet</a> <span>/</span> <span>Ödeme</span></div>
      <h1>Siparişi <span class="text-gradient">Tamamla</span></h1>
    </div>
  </div>

  <main class="container">
    <div class="checkout-layout" id="checkoutContent">
      <div>
        <div class="checkout-section glass-card">
          <h3>📍 Teslimat Bilgileri</h3>
          <div class="form-group"><label class="form-label">Ad Soyad *</label><input type="text" class="form-input" id="shippingName" required></div>
          <div class="form-row">
            <div class="form-group"><label class="form-label">Telefon *</label><input type="tel" class="form-input" id="shippingPhone" placeholder="05XX XXX XX XX" required></div>
            <div class="form-group"><label class="form-label">Şehir *</label><input type="text" class="form-input" id="shippingCity" required></div>
          </div>
          <div class="form-group"><label class="form-label">Adres *</label><textarea class="form-textarea" id="shippingAddress" rows="3" placeholder="Mahalle, sokak, bina no, daire no..." required></textarea></div>
        </div>

        <div class="checkout-section glass-card">
          <h3>💳 Ödeme Yöntemi</h3>
          <div class="payment-methods">
            <div class="payment-method active" onclick="selectPayment('credit_card', this)"><span class="pm-icon">💳</span>Kredi Kartı</div>
            <div class="payment-method" onclick="selectPayment('bank_transfer', this)"><span class="pm-icon">🏦</span>Havale/EFT</div>
            <div class="payment-method" onclick="selectPayment('cash_on_delivery', this)"><span class="pm-icon">💵</span>Kapıda Ödeme</div>
          </div>
          
          <div id="paymentDetails" style="margin-top: var(--space-lg); padding: var(--space-md); background: rgba(0,0,0,0.2); border-radius: var(--radius-md); border: 1px solid var(--border-color);">
            <!-- Dynamic payment content -->
          </div>

          <p style="margin-top: var(--space-md); color:var(--text-muted);font-size:0.85rem">⚠️ Demo amaçlı simülasyondur. Gerçek ödeme alınmaz.</p>
        </div>
      </div>

      <div>
        <div class="glass-card" style="position:sticky;top:calc(var(--nav-height) + 1rem)">
          <h3 style="font-family:var(--font-display);margin-bottom:var(--space-lg)">Sipariş Özeti</h3>
          <div id="orderItems"><div class="spinner" style="transform:scale(0.6)"></div></div>
          <div id="orderSummary" style="margin-top:var(--space-md)"></div>
          <button class="btn btn-primary" style="width:100%;margin-top:var(--space-lg);padding:1rem" onclick="placeOrder()" id="placeOrderBtn">✅ Siparişi Onayla</button>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script>
    let selectedPayment = 'credit_card';

    const paymentInfo = {
      credit_card: `
        <div class="form-group" style="margin-bottom: var(--space-md);">
          <label class="form-label">Kart Üzerindeki İsim</label>
          <input type="text" class="form-input" placeholder="Ad Soyad">
        </div>
        <div class="form-group" style="margin-bottom: var(--space-md);">
          <label class="form-label">Kart Numarası</label>
          <input type="text" class="form-input" placeholder="XXXX XXXX XXXX XXXX" maxlength="19">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Son Kullanma (AA/YY)</label>
            <input type="text" class="form-input" placeholder="12/25" maxlength="5">
          </div>
          <div class="form-group">
            <label class="form-label">CVV</label>
            <input type="text" class="form-input" placeholder="XXX" maxlength="3">
          </div>
        </div>
      `,
      bank_transfer: `
        <div style="font-size: 0.9rem; color: var(--text-secondary); line-height: 1.5;">
          <p style="margin-bottom: var(--space-sm);">Lütfen ödemeyi aşağıdaki banka hesabımıza gönderin. Açıklama kısmına sipariş oluşturulduktan sonra verilecek sipariş numarasını yazmayı unutmayın.</p>
          <p><strong>Banka:</strong> RoboShop Bankası</p>
          <p><strong>Alıcı:</strong> RoboShop Teknoloji A.Ş.</p>
          <p style="font-family: monospace; color: var(--accent-blue); margin-top: var(--space-xs); font-size: 1rem;">IBAN: TR00 0000 0000 0000 0000 0000 00</p>
        </div>
      `,
      cash_on_delivery: `
        <div style="font-size: 0.9rem; color: var(--text-secondary); line-height: 1.5;">
          <p>Siparişinizi teslim alırken kargo görevlisine nakit veya kredi kartı ile ödeme yapabilirsiniz.</p>
          <p style="color: var(--accent-green); margin-top: var(--space-sm);">✅ Kapıda ödeme hizmet bedeli: <strong>Ücretsiz</strong></p>
        </div>
      `
    };

    function selectPayment(method, el) {
      selectedPayment = method;
      document.querySelectorAll('.payment-method').forEach(e => e.classList.remove('active'));
      if(el) el.classList.add('active');
      document.getElementById('paymentDetails').innerHTML = paymentInfo[method];
    }

    async function loadCheckout() {
      const user = getUser();
      if (!user) { window.location.href = '/auth.html'; return; }
      try {
        const data = await api.getCart();
        if (data.items.length === 0) { window.location.href = '/cart.html'; return; }

        document.getElementById('orderItems').innerHTML = data.items.map(item => {
          const price = item.discount_price || item.price;
          return `<div class="order-item"><span style="flex:1">${item.name}</span><span class="order-item-qty">x${item.quantity}</span><span style="color:var(--accent-blue);font-weight:600">${formatPrice(price * item.quantity)}</span></div>`;
        }).join('');

        const shipping = data.total > 5000 ? 0 : 250;
        document.getElementById('orderSummary').innerHTML = `
          <div style="display:flex;justify-content:space-between;padding:0.4rem 0;font-size:0.9rem"><span>Ara Toplam</span><span>${formatPrice(data.total)}</span></div>
          <div style="display:flex;justify-content:space-between;padding:0.4rem 0;font-size:0.9rem"><span>Kargo</span><span>${shipping === 0 ? '<span style="color:var(--accent-green)">Ücretsiz</span>' : formatPrice(shipping)}</span></div>
          <div style="display:flex;justify-content:space-between;padding:0.6rem 0;font-size:1.2rem;font-weight:800;border-top:2px solid var(--border-color);margin-top:0.4rem"><span>Toplam</span><span style="color:var(--accent-blue);font-family:var(--font-display)">${formatPrice(data.total + shipping)}</span></div>
        `;

        // Fill user name
        document.getElementById('shippingName').value = user.name;
        
        // Init payment details
        selectPayment('credit_card', document.querySelector('.payment-method.active'));
      } catch (err) { showToast('Sepet yüklenemedi.', 'error'); }
    }

    async function placeOrder() {
      const name = document.getElementById('shippingName').value.trim();
      const phone = document.getElementById('shippingPhone').value.trim();
      const city = document.getElementById('shippingCity').value.trim();
      const address = document.getElementById('shippingAddress').value.trim();

      if (!name || !phone || !city || !address) { showToast('Tüm teslimat bilgilerini doldurun.', 'error'); return; }

      const btn = document.getElementById('placeOrderBtn');
      btn.disabled = true; btn.textContent = '⏳ İşleniyor...';

      try {
        const result = await api.createOrder({
          shipping_name: name, shipping_phone: phone, shipping_city: city,
          shipping_address: address, payment_method: selectedPayment
        });

        document.body.innerHTML += `
          <div class="success-overlay">
            <div class="success-card glass-card">
              <div class="success-icon">🎉</div>
              <h2 style="font-family:var(--font-display);margin-bottom:var(--space-md)">Sipariş Alındı!</h2>
              <p style="color:var(--text-secondary);margin-bottom:var(--space-sm)">Sipariş numaranız: <strong style="color:var(--accent-blue)">#${result.orderId}</strong></p>
              <p style="color:var(--text-muted);margin-bottom:var(--space-xl)">Siparişiniz en kısa sürede hazırlanacaktır.</p>
              <div style="display:flex;gap:var(--space-md);justify-content:center">
                <a href="/orders.html" class="btn btn-primary">📦 Siparişlerim</a>
                <a href="/products.html" class="btn btn-secondary">🛍️ Alışverişe Devam</a>
              </div>
            </div>
          </div>`;
      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false; btn.textContent = '✅ Siparişi Onayla';
      }
    }

    document.addEventListener('DOMContentLoaded', loadCheckout);
  </script>
</body>
</html>
